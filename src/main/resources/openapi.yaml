openapi: 3.0.3
info:
  title: Gamefound Campaign Notifier API
  version: 0.0.1

servers:
  - url: http://localhost:8080/api
    description: Local development

paths:
  /v1/campaigns:
    get:
      tags:
        - Campaigns
      operationId: searchCampaigns
      summary: Search active campaigns by publisher, game, or BGG username
      description: >
        Provide at most one of: publisherName, gameName, bggUsername.
        If none is provided, all active Gamefound campaigns are returned.
        Providing more than one results in a 400 Bad Request.
        All three modes ultimately match campaigns by their creator: gameName resolves to that
        game's publisher, and bggUsername resolves to the publishers of every game in the user's
        BGG collection.
      parameters:
        - name: publisherName
          in: query
          required: false
          schema:
            type: string
        - name: gameName
          in: query
          required: false
          schema:
            type: string
        - name: bggUsername
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of matching active campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignResponse"

  /v1/games/suggestions:
    get:
      tags:
        - Games
      operationId: suggestGames
      summary: Suggest base game names matching a partial query, for search autocomplete
      description: >
        Returns up to 10 games whose name contains the query, ordered alphabetically.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching game suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSuggestionResponse"

  /v1/email-requests:
    post:
      tags:
        - EmailRequests
      operationId: createEmailRequest
      summary: Request an email with a single campaign
      description: >
        Accepts the request and sends the email asynchronously.                            
        The recipient is resolved on the server side and cannot be provided by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmailRequest"
      responses:
        "202":
          description: Request accepted, email will be sent in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailRequestResponse"
        "400":
          description: Invalid request body

  /v1/email-requests/{id}:
    get:
      tags:
        - EmailRequests
      operationId: getEmailRequest
      security:
        - bearerAuth: [ ]
      summary: Get the status of an email request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Email request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailRequestResponse"
        "401":
          description: Missing, invalid or expired token
        "404":
          description: Email request not found or not owned by the current user
  /v1/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "409":
          description: Email or username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"

  /v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Log in and obtain a JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "401":
          description: Invalid email or password
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"

  /v1/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      summary: Get the currently logged-in user
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing, invalid or expired token

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GameSuggestionResponse:
      type: object
      properties:
        name:
          type: string
        yearPublished:
          type: integer

    CampaignResponse:
      type: object
      properties:
        projectName:
          type: string
        creatorName:
          type: string
        campaignStartDate:
          type: string
          format: date-time
        campaignEndDate:
          type: string
          format: date-time
        shortDescription:
          type: string
        fundsGathered:
          type: number
        campaignGoal:
          type: number
        currencyShortName:
          type: string
        backerCount:
          type: integer
        projectHomeUrl:
          type: string
          format: uri
        projectImageUrl:
          type: string
          format: uri
        projectUrlName:
          type: string

    CreateEmailRequest:
      type: object
      required:
        - projectUrlName
      properties:
        projectUrlName:
          type: string
          minLength: 1
          maxLength: 255

    EmailRequestResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PENDING
            - SENT
            - FAILED
        projectUrlName:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_.-]+$"
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 72

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
            - USER
            - ADMIN

    ProblemResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 72

    LoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time