spring:
  application:
    name: gamefound-campaign-notifier

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mvc:
    problemdetails:
      enabled: true

  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 3
          max-interval: 30s

  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  servlet:
    context-path: /api

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health

bgg:
  api:
    base-url: https://boardgamegeek.com/xmlapi2
    token: ${BGG_API_TOKEN}

gamefound:
  api:
    base-url: https://gamefound.com

notifications:
  mail:
    from: ${NOTIFICATIONS_MAIL_FROM:noreply@gamefound-notifier.local}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 24h
    issuer: gamefound-campaign-notifier