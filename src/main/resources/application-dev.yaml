spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gamefound
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: gamefound
    password: gamefound
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN:}
    password: ${BREVO_SMTP_KEY:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true